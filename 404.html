<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101734">
<title>AniManxwa</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101734;color:#f3f0ff;font:16px system-ui,sans-serif}</style>
<script>
// /REPO/manhwa/123/456/  ->  /REPO/?manhwa=123&chapter=456  (asosiy sahifa shu yerda ishlaydi)
(function () {
  var m = location.pathname.match(/^(.*?)\/(manga|manhwa|manhua|novella)\/([^\/]+)(?:\/(\d+))?\/?$/i);
  if (m) location.replace(m[1] + "/?t=" + m[2].toLowerCase() + "&s=" + m[3] + (m[4] ? "&c=" + m[4] : ""));
  else document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("t").textContent = "Sahifa topilmadi. Havolani tekshiring.";
  });
})();
</script>
</head>
<body><p id="t">Yuklanmoqda...</p></body>
</html>
